name: crm-by-elivate

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://postgres:${PG_DATABASE_PASSWORD}@postgres:5432/default
      REDIS_URL: redis://redis:6379
      SERVER_URL: ${SERVER_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      PG_DATABASE_URL: postgres://postgres:${PG_DATABASE_PASSWORD}@postgres:5432/default
      REDIS_URL: redis://redis:6379
      SERVER_URL: ${SERVER_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  intake:
    build:
      context: .
      dockerfile: Dockerfile.intake
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      TWENTY_API_URL: http://server:3000
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      TWENTY_TEAM_OBJECT: ${TWENTY_TEAM_OBJECT:-teams}
      TWENTY_TEAM_NAME_FIELD: ${TWENTY_TEAM_NAME_FIELD:-name}
      TWENTY_PERSON_OBJECT: ${TWENTY_PERSON_OBJECT:-people}
      TWENTY_OPPORTUNITY_OBJECT: ${TWENTY_OPPORTUNITY_OBJECT:-opportunities}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d default"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  server-local-data:
