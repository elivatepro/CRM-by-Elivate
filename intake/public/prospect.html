<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>New Prospect · Elivate Network</title>
<link rel="icon" href="/elivate-mark.png" />
<link rel="stylesheet" href="/form.css" />
</head>
<body>

<div class="watermark-frame" aria-hidden="true">
  <img class="watermark" src="/elivate-mark.png" alt="" />
</div>

<div class="page">
  <div class="shell" id="shell">
    <header class="masthead">
      <img class="mark" src="/elivate-mark.png" alt="Elivate Network" />
      <div>
        <p class="eyebrow">Elivate Network</p>
        <h1>New prospect</h1>
      </div>
      <p class="lede">Capture a prospect so the right team can follow up on WhatsApp.</p>
    </header>

    <form id="form" novalidate>
      <div class="field">
        <label id="team-label" for="team-trigger">Team <span class="req" aria-hidden="true">*</span></label>
        <div class="select" id="team-select" data-open="false">
          <button type="button" class="select-trigger" id="team-trigger"
                  role="combobox" aria-haspopup="listbox" aria-expanded="false"
                  aria-controls="team-list" aria-labelledby="team-label team-trigger"
                  aria-describedby="team-err" data-placeholder="true" disabled>
            <span class="select-value" id="team-value">Loading teams…</span>
            <span class="select-caret" aria-hidden="true"></span>
          </button>
          <ul class="select-list" id="team-list" role="listbox" aria-labelledby="team-label"></ul>
        </div>
        <input type="hidden" id="team" name="team" value="" />
        <p class="err" id="team-err" role="alert"></p>
      </div>

      <div class="field">
        <label for="name">Full name <span class="req" aria-hidden="true">*</span></label>
        <input id="name" name="name" type="text" required autocomplete="name"
               autocapitalize="words" spellcheck="false" aria-describedby="name-err" />
        <p class="err" id="name-err" role="alert"></p>
      </div>

      <div class="field">
        <label for="email">Email <span class="req" aria-hidden="true">*</span></label>
        <input id="email" name="email" type="email" required autocomplete="email"
               inputmode="email" autocapitalize="off" spellcheck="false"
               aria-describedby="email-err" />
        <p class="err" id="email-err" role="alert"></p>
      </div>

      <div class="field">
        <label for="phone">WhatsApp number <span class="req" aria-hidden="true">*</span></label>
        <div class="phone-row" id="phone-row">
          <span class="dial" aria-hidden="true">🇳🇬 +234</span>
          <label class="sr-only" for="phone">Nigerian WhatsApp number without the country code</label>
          <input id="phone" name="phone" type="tel" required inputmode="numeric"
                 autocomplete="tel-national" placeholder="801 234 5678"
                 maxlength="13" aria-describedby="phone-err phone-hint" />
        </div>
        <p class="hint" id="phone-hint">Nigerian numbers only — e.g. 0801 234 5678.</p>
        <p class="err" id="phone-err" role="alert"></p>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <button class="submit" id="submit" type="submit">Add prospect</button>
    </form>

    <footer>Elivate Network</footer>
  </div>
</div>

<script>
  const form = document.getElementById('form');
  const teamField = document.getElementById('team');
  const phoneInput = document.getElementById('phone');
  const phoneRow = document.getElementById('phone-row');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submit');

  const setError = (id, message) => {
    const errEl = document.getElementById(id + '-err');
    const target =
      id === 'team' ? document.getElementById('team-trigger') : document.getElementById(id);
    errEl.textContent = message || '';
    if (target) target.setAttribute('aria-invalid', message ? 'true' : 'false');
    if (id === 'phone') phoneRow.dataset.invalid = message ? 'true' : 'false';
    return !message;
  };

  const clearErrors = () => ['team', 'name', 'email', 'phone'].forEach((id) => setError(id, ''));

  // --- Custom dropdown -----------------------------------------------------
  const selectRoot = document.getElementById('team-select');
  const trigger = document.getElementById('team-trigger');
  const valueEl = document.getElementById('team-value');
  const listEl = document.getElementById('team-list');

  let teamOptions = [];
  let activeIndex = -1;

  const isOpen = () => selectRoot.dataset.open === 'true';

  const setActive = (index) => {
    activeIndex = index;
    const nodes = listEl.querySelectorAll('.select-option');
    nodes.forEach((node, i) => {
      const active = i === index;
      node.dataset.active = active ? 'true' : 'false';
      if (active) {
        trigger.setAttribute('aria-activedescendant', node.id);
        node.scrollIntoView({ block: 'nearest' });
      }
    });
  };

  const closeList = () => {
    selectRoot.dataset.open = 'false';
    trigger.setAttribute('aria-expanded', 'false');
    trigger.removeAttribute('aria-activedescendant');
  };

  const openList = () => {
    if (trigger.disabled || teamOptions.length === 0) return;
    selectRoot.dataset.open = 'true';
    trigger.setAttribute('aria-expanded', 'true');
    const current = teamOptions.findIndex((t) => t.id === teamField.value);
    setActive(current >= 0 ? current : 0);
  };

  const choose = (index) => {
    const team = teamOptions[index];
    if (!team) return;
    teamField.value = team.id;
    valueEl.textContent = team.name;
    trigger.dataset.placeholder = 'false';
    listEl.querySelectorAll('.select-option').forEach((node, i) => {
      node.setAttribute('aria-selected', i === index ? 'true' : 'false');
    });
    setError('team', '');
    closeList();
    trigger.focus();
  };

  const renderOptions = () => {
    listEl.replaceChildren();
    teamOptions.forEach((team, i) => {
      const item = document.createElement('li');
      item.className = 'select-option';
      item.id = 'team-option-' + i;
      item.setAttribute('role', 'option');
      item.setAttribute('aria-selected', teamField.value === team.id ? 'true' : 'false');
      item.textContent = team.name;
      item.addEventListener('click', () => choose(i));
      item.addEventListener('mousemove', () => setActive(i));
      listEl.append(item);
    });
  };

  trigger.addEventListener('click', () => (isOpen() ? closeList() : openList()));

  trigger.addEventListener('keydown', (event) => {
    const { key } = event;
    if (!isOpen()) {
      if (key === 'ArrowDown' || key === 'Enter' || key === ' ') {
        event.preventDefault();
        openList();
      }
      return;
    }
    if (key === 'ArrowDown') {
      event.preventDefault();
      setActive(Math.min(activeIndex + 1, teamOptions.length - 1));
    } else if (key === 'ArrowUp') {
      event.preventDefault();
      setActive(Math.max(activeIndex - 1, 0));
    } else if (key === 'Home') {
      event.preventDefault();
      setActive(0);
    } else if (key === 'End') {
      event.preventDefault();
      setActive(teamOptions.length - 1);
    } else if (key === 'Enter' || key === ' ') {
      event.preventDefault();
      choose(activeIndex);
    } else if (key === 'Escape') {
      event.preventDefault();
      closeList();
    } else if (key === 'Tab') {
      closeList();
    }
  });

  document.addEventListener('click', (event) => {
    if (isOpen() && !selectRoot.contains(event.target)) closeList();
  });

  const setTriggerMessage = (message) => {
    valueEl.textContent = message;
    trigger.dataset.placeholder = 'true';
    trigger.disabled = true;
  };

  // Load the real teams from the CRM.
  const loadTeams = async () => {
    try {
      const response = await fetch('/api/teams');
      if (!response.ok) throw new Error('load failed');

      const { teams } = await response.json();

      if (!teams || teams.length === 0) {
        setTriggerMessage('No teams found in the CRM');
        return;
      }

      teamOptions = teams;
      renderOptions();
      valueEl.textContent = 'Select a team';
      trigger.dataset.placeholder = 'true';
      trigger.disabled = false;
    } catch {
      setTriggerMessage('Could not load teams');
      setError('team', 'Teams could not be loaded. Refresh the page to try again.');
    }
  };

  loadTeams();

  // Nigerian mobile: 10 national digits, first digit 7/8/9.
  const nationalDigits = (raw) => {
    let digits = String(raw).replace(/\D/g, '');
    if (digits.startsWith('234')) digits = digits.slice(3);
    return digits.replace(/^0+/, '');
  };

  // Display grouping: 801 234 5678
  phoneInput.addEventListener('input', () => {
    const digits = phoneInput.value.replace(/\D/g, '').slice(0, 11);
    const groups = [];
    if (digits.length > 0) groups.push(digits.slice(0, digits.startsWith('0') ? 4 : 3));
    const rest = digits.slice(groups[0]?.length ?? 0);
    if (rest.length > 0) groups.push(rest.slice(0, 3));
    if (rest.length > 3) groups.push(rest.slice(3, 7));
    phoneInput.value = groups.join(' ').trim();
  });

  const emailOk = (value) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value);

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearErrors();
    statusEl.removeAttribute('data-kind');
    statusEl.textContent = '';

    const teamId = teamField.value;
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const national = nationalDigits(phoneInput.value);

    let valid = true;
    valid = setError('team', teamId ? '' : 'Choose a team.') && valid;
    valid = setError('name', name.length >= 2 ? '' : 'Enter the prospect’s full name.') && valid;
    valid = setError('email', emailOk(email) ? '' : 'Enter a valid email address.') && valid;

    let phoneMessage = '';
    if (national.length === 0) phoneMessage = 'Enter their WhatsApp number.';
    else if (national.length !== 10) phoneMessage = 'A Nigerian number has 10 digits after +234.';
    else if (!/^[789]/.test(national)) phoneMessage = 'That is not a valid Nigerian mobile number.';
    valid = setError('phone', phoneMessage) && valid;

    if (!valid) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Adding…';

    try {
      const response = await fetch('/api/prospects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ teamId, name, email, whatsapp: '+234' + national }),
      });

      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        if (payload.errors) {
          for (const [field, message] of Object.entries(payload.errors)) setError(field, message);
          throw new Error('validation');
        }
        throw new Error('save failed');
      }

      const shell = document.getElementById('shell');
      const done = document.createElement('div');
      done.className = 'done';

      const heading = document.createElement('h2');
      heading.textContent = 'Prospect added';

      const detail = document.createElement('p');
      detail.textContent = name + ' has been added for follow-up.';

      const again = document.createElement('button');
      again.className = 'again';
      again.type = 'button';
      again.textContent = 'Add another';
      again.addEventListener('click', () => location.reload());

      done.append(heading, detail, again);
      shell.replaceChildren(shell.querySelector('.masthead'), done);
    } catch (error) {
      if (error.message !== 'validation') {
        statusEl.dataset.kind = 'error';
        statusEl.textContent = 'Could not save this prospect. Check your connection and try again.';
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Add prospect';
    }
  });
</script>
</body>
</html>
