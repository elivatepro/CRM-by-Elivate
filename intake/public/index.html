<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Elivate Network Forms</title>
<link rel="icon" href="/elivate-mark.png" />
<link rel="stylesheet" href="/form.css" />
</head>
<body>

<div class="watermark-frame" aria-hidden="true">
  <img class="watermark" src="/elivate-mark.png" alt="" />
</div>

<div class="page">
  <div class="shell">
    <header class="masthead">
      <img class="mark" src="/elivate-mark.png" alt="Elivate Network" />
      <div>
        <p class="eyebrow">Elivate Network</p>
        <h1>Forms</h1>
      </div>
      <p class="lede">Choose the form you need.</p>
    </header>

    <nav class="form-links">
      <a class="form-link" href="/prospect">
        <span class="form-link-title">New prospect</span>
        <span class="form-link-desc">
          Capture a prospect so the right team can follow up on WhatsApp.
        </span>
      </a>

      <a class="form-link" href="/member">
        <span class="form-link-title">Join Elivate Network</span>
        <span class="form-link-desc">
          Register as a member of the network.
        </span>
      </a>

      <a class="form-link" href="/order">
        <span class="form-link-title">Submit your order</span>
        <span class="form-link-desc">
          Send your monthly order details for team pickup.
        </span>
      </a>
    </nav>

    <footer>Elivate Network</footer>
  </div>
</div>

</body>
</html>
